[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
libs = ["contracts/lib"]
solc_version = "0.8.24"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./evidence" }
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 200
fail_on_revert = false

[lint]
lint_on_build = false
