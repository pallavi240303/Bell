services:
  worker:
    image: ghcr.io/pallavi240303/bell-cre-worker:latest
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - ./.env.worker
    environment:
      BELL_WORKER_DATA_DIR: /data
      BELL_WORKER_JOBS_DIR: /jobs
    volumes:
      - worker-data:/data
      - type: bind
        source: ./worker-jobs
        target: /jobs
        read_only: true
        bind:
          create_host_path: false
volumes:
  worker-data:
